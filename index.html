<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Koala Kids · Catálogo de disfraces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Nunito:wght@500;700;800&family=Yellowtail&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Decoración de fondo fija (no interactiva) -->
<div class="bg-deco" aria-hidden="true">
  <svg class="blob blob-a" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
    <path fill="currentColor" d="M431,306Q419,362,382,412Q345,462,286,468Q227,474,178,438Q129,402,101,346Q73,290,95,231Q117,172,166,133Q215,94,275,101Q335,108,378,150Q421,192,428,249Q435,306,431,306Z"/>
  </svg>
  <svg class="blob blob-b" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
    <path fill="currentColor" d="M445,321Q431,392,373,432Q315,472,250,455Q185,438,136,392Q87,346,90,278Q93,210,141,163Q189,116,256,109Q323,102,373,146Q423,190,438,255Q453,320,445,321Z"/>
  </svg>
  <svg class="ring" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    <circle cx="200" cy="200" r="160" fill="none" stroke="currentColor" stroke-width="26"/>
  </svg>
  <div class="dots dots-a"></div>
  <div class="dots dots-b"></div>
</div>

<!-- Barra superior -->
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">🐨</span>
    <span class="brand-name">Koala Kids</span>
  </div>
  <button class="btn-search" id="openSearch" type="button">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.2" y2="16.2"/></svg>
    <span>Buscar productos</span>
  </button>
</header>

<!-- Escenario del libro -->
<main class="stage">
  <div class="book-row">
    <button class="nav-arrow nav-arrow-left" id="arrowPrev" type="button" aria-label="Página anterior">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>

    <div class="book-stage">
      <div class="book" id="book">
        <!-- Las páginas <canvas> se insertan aquí vía JS -->
        <div class="book-loading" id="bookLoading">
          <div class="spinner"></div>
          <p id="loadingText">Cargando catálogo…</p>
        </div>
        <div class="book-error" id="bookError" hidden>
          <p class="book-error-title">No se pudo abrir el catálogo</p>
          <p id="bookErrorMsg"></p>
        </div>
      </div>
      <div class="click-zone click-zone-left" id="zoneLeft" aria-hidden="true"></div>
      <div class="click-zone click-zone-right" id="zoneRight" aria-hidden="true"></div>
    </div>

    <button class="nav-arrow nav-arrow-right" id="arrowNext" type="button" aria-label="Página siguiente">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>

  <!-- Barra tipo píldora -->
  <div class="pillbar">
    <button class="pill-btn" id="pillPrev" type="button" aria-label="Anterior">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="pill-page">
      <input type="number" id="pageInput" min="1" value="1" inputmode="numeric" aria-label="Ir a la página">
      <span class="pill-of">de <span id="pageTotal">–</span></span>
    </div>
    <button class="pill-btn" id="pillNext" type="button" aria-label="Siguiente">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>
</main>

<!-- Overlay del drawer -->
<div class="drawer-overlay" id="drawerOverlay"></div>

<!-- Drawer de búsqueda -->
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <h2>Buscar productos</h2>
    <button class="drawer-close" id="closeSearch" type="button" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
    </button>
  </div>

  <div class="drawer-body">
    <label class="field">
      <span class="field-label">Nombre del producto</span>
      <input type="text" id="filterText" placeholder="Ej. vestido, sombrero, falda…" autocomplete="off">
    </label>

    <label class="field">
      <span class="field-label">Categoría</span>
      <select id="filterCategory">
        <option value="">Todas las categorías</option>
      </select>
    </label>

    <div class="field">
      <span class="field-label">Rango de precio</span>
      <div class="price-inputs">
        <div class="price-input-wrap">
          <span>$</span>
          <input type="number" id="priceMinInput" min="0" step="5">
        </div>
        <span class="price-sep">—</span>
        <div class="price-input-wrap">
          <span>$</span>
          <input type="number" id="priceMaxInput" min="0" step="5">
        </div>
      </div>
      <div class="range-slider" id="rangeSlider">
        <div class="range-track"></div>
        <div class="range-fill" id="rangeFill"></div>
        <input type="range" id="rangeMin" min="0" max="3000" step="5">
        <input type="range" id="rangeMax" min="0" max="3000" step="5">
      </div>
    </div>

    <button class="btn-clear" id="clearFilters" type="button">Limpiar filtros</button>

    <div class="results-head">
      <span id="resultsCount">0 productos</span>
    </div>

    <div class="results-list" id="resultsList"></div>
    <p class="no-results" id="noResults" hidden>No se encontraron productos con esos filtros.</p>
  </div>
</aside>

<!-- PDF.js desde CDN (no se empaqueta localmente) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
